name: CI
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - parallel:
          - name: Test
            run: npm test
          - name: Format check
            run: npm run format:check
          - name: Typecheck
            run: npm run typecheck
          - name: Lint
            run: npm run lint
          - name: Consumer fixture
            run: npm run test:consumer
          - name: Consumer fixture on React 18
            run: npm run test:consumer
            env:
              CONSUMER_EXTRA_DEPS: react@18 react-dom@18 @types/react@18 @types/react-dom@18 react-router@7

  # Runs when a `v*` tag is pushed. npm trusts this workflow file by name
  # (trusted publishing), so the job needs `id-token` and no npm token.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check that the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm publish
