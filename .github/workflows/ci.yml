name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - parallel:
          - name: Test
            run: npm test
          - name: Format check
            run: npm run format:check
          - name: Typecheck
            run: npm run typecheck
          - name: Lint
            run: npm run lint
          - name: Showcase build
            run: npm run showcase:build
          - name: Consumer fixture
            run: npm run test:consumer
          - name: Consumer fixture on React 18
            run: npm run test:consumer
            env:
              CONSUMER_EXTRA_DEPS: react@18 react-dom@18 @types/react@18 @types/react-dom@18 react-router@7

  # Publishes when a merge to main changes the version in package.json to one
  # that npm does not have yet. npm trusts this workflow file by name (trusted
  # publishing), so the job needs `id-token` and no npm token.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check whether npm already has this version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          published=$(npm view @swecc/ui versions --json | node -e "const v = JSON.parse(require('fs').readFileSync(0, 'utf8')); console.log([].concat(v).includes(process.argv[1]))" "$version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "published=$published" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.published == 'false'
        run: npm ci
      - if: steps.version.outputs.published == 'false'
        run: npm publish
      - name: Tag the release
        if: steps.version.outputs.published == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
